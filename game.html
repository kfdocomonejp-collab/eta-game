<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>イータ君 中ビームよけ</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--felt:#0d4a34;--felt2:#083426;--ink:#fff8e6;--red:#e0262b}
html,body{margin:0;height:100%;background:var(--felt2);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;color:var(--ink)}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;box-sizing:border-box;pointer-events:none}
#ui.hide{display:none}
#ui h1{margin:0;font-size:clamp(28px,8vw,46px);letter-spacing:.06em;text-shadow:0 3px 0 #000,0 0 18px rgba(224,38,43,.6)}
#ui h1 b{color:var(--red)}
#ui p{margin:0;font-size:15px;line-height:1.7;opacity:.92;text-shadow:0 2px 0 #000}
#ui .big{font-size:clamp(40px,12vw,64px);font-weight:700;color:#ffd84a;text-shadow:0 3px 0 #000}
#ui .over{font-size:clamp(34px,10vw,54px);color:var(--red);text-shadow:0 3px 0 #000}
.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px 30px;font:700 18px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.go{background:#ffd84a;color:#2a1a00}
.line{background:#06c755;color:#fff}
.rk{background:#fff8e6;color:#3a2000}
.nm{pointer-events:auto;font:16px/1.2 inherit;font-family:inherit;padding:10px 14px;border-radius:10px;border:2px solid #ffd84a;background:rgba(0,0,0,.35);color:#fff;width:min(260px,80vw);text-align:center;box-sizing:border-box}
.rkbox{pointer-events:auto;background:rgba(0,0,0,.45);border:1px solid rgba(255,216,74,.5);border-radius:14px;padding:10px 14px;width:min(340px,88vw);box-sizing:border-box;max-height:55vh;overflow:auto}
.rkbox table{width:100%;border-collapse:collapse;font-size:17px}
.rkbox td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
.rkbox .no{width:2.2em;text-align:center}.rkbox .na{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.rkbox .sc{text-align:right;color:#ffd84a;font-weight:700;white-space:nowrap}.rkbox small{font-size:.7em;margin-left:2px;color:#fff}
.rkbox .na img,.who img{width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:6px;object-fit:cover}
.who{font-size:17px!important}
.rkbox tr.me td{background:rgba(255,216,74,.18)}
.slip{position:relative;background:#faf5dc;color:#2a2010;border-radius:6px;padding:12px 16px 14px;width:min(320px,86vw);box-sizing:border-box;box-shadow:0 6px 0 rgba(0,0,0,.45);text-align:left;font-size:15px;line-height:1.5;animation:slipIn .35s ease-out}
.slip h2{margin:0 0 8px;font-size:17px;text-align:center;letter-spacing:.3em;border-bottom:2px solid #2a2010;padding-bottom:4px}
.slip .row{display:flex;justify-content:space-between;align-items:baseline}.slip .sub{font-size:12px;color:#6a5a40;margin:-2px 0 4px 1em}
.slip .tot{border-top:1px solid #2a2010;margin-top:6px;padding-top:6px;font-weight:700}.slip .tot b{font-size:30px;color:#b30000}
@keyframes slipIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:700 26px/1 inherit;font-family:inherit;text-shadow:0 2px 0 #000;pointer-events:none}
#hud small{display:block;font-size:12px;opacity:.75;margin-top:4px}
</style>
</head>

// ---- 音 ----
let AC=null; const buf={};
function initAudio(){
  if(AC) return; try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  for(const [k,s] of [['start',SND_START],['over',SND_OVER]]){
    const b=atob(s.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
    AC.decodeAudioData(a.buffer,d=>buf[k]=d,()=>{});
  }
}
function play(k,g=1){if(!AC||!buf[k])return;const s=AC.createBufferSource(),v=AC.createGain();v.gain.value=g;s.buffer=buf[k];s.connect(v).connect(AC.destination);s.start()}
function tone(f0,f1,dur,type='sawtooth',g=.08){
  if(!AC)return;const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+dur)
}

// ---- 状態 ----
// 還付金 = 秒×秒×30円 / 還付加算金 = 還付金×10%×ギリギリ回数(ランキングは合計で競う。ランキングAPI側も同じ式)
function yen(s,g){const h=Math.floor(s*s*30);const k=Math.floor(h*g/10);return{h,k,y:h+k}}
const fmt=n=>n.toLocaleString('ja-JP');
let state='title', P, tiles, parts, t, last, spawnT, best=0, shake=0, deadT=0, near=0;
try{best=+localStorage.getItem('eta_chun_best_yen')||0}catch(e){}
const FW=()=>U*17, FH=()=>FW()*192/256, HIT=()=>FW()*0.36;
let homeY=null, faceGone=false;
function reset(){faceGone=false;P={x:W/2,y:clamp(homeY??H*.62,FH()/2,H-FH()/2),vx:0,vy:0};tiles=[];parts=[];t=0;spawnT=1.0;shake=0;near=0}

// ---- 操作: 指をずらした分だけ動く(顔が指で隠れない) ----
let drag=null;
cv.addEventListener('pointerdown',e=>{initAudio();if(state!=='play')return;drag={x:e.clientX,y:e.clientY,px:P.x,py:P.y};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag||state!=='play')return;const k=1.25;P.x=clamp(drag.px+(e.clientX-drag.x)*k,FW()/2,W-FW()/2);P.y=clamp(drag.py+(e.clientY-drag.y)*k,FH()/2,H-FH()/2)});
const end=()=>drag=null; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
const keys={}; addEventListener('keydown',e=>keys[e.key]=1); addEventListener('keyup',e=>keys[e.key]=0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- 中の牌 ----
// 画面の外から入ってくる → イータ君を狙ってためる(赤い予告線) → 狙いを固定 → ビーム → 引っ込む
function spawn(){
  const lv=t;
  const side=Math.floor(Math.random()*4), m=U*7;
  let x,y,ox,oy;
  if(side===0){x=rand(m,W-m);y=m+U*9;ox=x;oy=-m*2}
  else if(side===1){x=W-m;y=rand(m+U*9,H-m);ox=W+m*2;oy=y}
  else if(side===2){x=rand(m,W-m);y=H-m;ox=x;oy=H+m*2}
  else{x=m;y=rand(m+U*9,H-m);ox=-m*2;oy=y}
  const charge=Math.max(.55,1.15-lv*.012);
  const sweep= lv>25 && Math.random()<Math.min(.45,(lv-25)*.02) ? (Math.random()<.5?-1:1)*rand(.5,.9) : 0;
  tiles.push({x,y,ox,oy,ang:Math.atan2(P.y-y,P.x-x),ph:'in',pt:0,charge,fire:.55+(sweep?0.35:0),sweep,lock:false,wide:U*(sweep?3.2:4.2)});
}
const rand=(a,b)=>a+Math.random()*(b-a);
function interval(){return Math.max(.38,1.5-t*.035)}

function segDist(px,py,ax,ay,ang){ // 点から半直線までの距離
  const dx=Math.cos(ang),dy=Math.sin(ang),k=(px-ax)*dx+(py-ay)*dy;
  if(k<0)return Math.hypot(px-ax,py-ay);
  return Math.abs((px-ax)*dy-(py-ay)*dx);
}

function update(dt){
  if(state!=='play'){ if(state==='dead'){deadT+=dt;} upParts(dt); return }
  t+=dt;
  const sp=U*60*dt; if(keys.ArrowLeft||keys.a)P.x-=sp; if(keys.ArrowRight||keys.d)P.x+=sp; if(keys.ArrowUp||keys.w)P.y-=sp; if(keys.ArrowDown||keys.s)P.y+=sp;
  P.x=clamp(P.x,FW()/2,W-FW()/2);P.y=clamp(P.y,FH()/2,H-FH()/2);
  spawnT-=dt; if(spawnT<=0){spawn(); if(t>40&&Math.random()<.35)spawn(); spawnT=interval()}
  for(const s of tiles){
    s.pt+=dt;
    if(s.ph==='in'){ if(s.pt>.3){s.ph='charge';s.pt=0} }
    else if(s.ph==='charge'){
      if(s.pt<s.charge*.72){const a=Math.atan2(P.y-s.y,P.x-s.x);s.ang=lerpAng(s.ang,a,Math.min(1,dt*10))}
      else if(!s.lock){s.lock=true;tone(300,1200,.25,'square',.03)}
      if(s.pt>s.charge){s.ph='fire';s.pt=0;tone(900,90,.45,'sawtooth',.09);shake=Math.max(shake,U*.8);s.passed=false}
    }
    else if(s.ph==='fire'){
      s.ang+=s.sweep*dt;
      const d=segDist(P.x,P.y,s.x,s.y,s.ang);
      if(d<s.wide/2+HIT()) {die(s);return}
      if(d<s.wide/2+HIT()+U*4)s.close=true;
      if(Math.random()<.6)parts.push({x:s.x+Math.cos(s.ang)*U*5,y:s.y+Math.sin(s.ang)*U*5,vx:rand(-1,1)*U*20,vy:rand(-1,1)*U*20,l:.3,c:'#ffd0a0'});
      if(s.pt>s.fire){s.ph='out';s.pt=0;if(s.close){near++;floatText('ギリギリ!',P.x,P.y-FH()*.8)}}
    }
    else if(s.ph==='out'){ if(s.pt>.35)s.dead=true }
  }
  tiles=tiles.filter(s=>!s.dead);
  upParts(dt);
}
function lerpAng(a,b,k){let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*k}
const floats=[];function floatText(s,x,y){floats.push({s,x,y,l:.8})}
function upParts(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=U*12*dt;f.l-=dt} for(let i=floats.length-1;i>=0;i--)if(floats[i].l<=0)floats.splice(i,1);
  shake*=Math.pow(.02,dt);
}
function die(s){
  state='dead';deadT=0;shake=U*3;faceGone=true;
  tone(160,40,.6,'sawtooth',.12);setTimeout(()=>play('over',1),250);
  for(let i=0;i<60;i++)parts.push({x:P.x,y:P.y,vx:rand(-1,1)*U*90,vy:rand(-1,1)*U*90,l:rand(.4,1),c:Math.random()<.5?'#8dc63f':'#fff1c0'});
  if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}
  const sc=Math.floor(t*100)/100, y=yen(sc,near).y, nb=y>best; if(nb){best=y;try{localStorage.setItem('eta_chun_best_yen',best)}catch(e){}}
  setTimeout(()=>showOver(sc,nb),1100);
}

// ---- 描画 ----
function bg(){
  const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'#13624a');g.addColorStop(1,'#062a1e');
  cx.fillStyle=g;cx.fillRect(-50,-50,W+100,H+100);
  cx.strokeStyle='rgba(255,255,255,.04)';cx.lineWidth=1;
  for(let x=0;x<W;x+=U*10){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
  for(let y=0;y<H;y+=U*10){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
}
function tileDraw(s){
  let x=s.x,y=s.y;
  if(s.ph==='in'){const k=ease(s.pt/.3);x=s.ox+(s.x-s.ox)*k;y=s.oy+(s.y-s.oy)*k}
  if(s.ph==='out'){const k=ease(s.pt/.35);x=s.x+(s.ox-s.x)*k;y=s.y+(s.oy-s.y)*k}
  const w=U*9,h=U*12;
  // 予告線
  if(s.ph==='charge'){
    const a=s.lock?.85:.25+.25*Math.sin(s.pt*30);
    cx.save();cx.translate(x,y);cx.rotate(s.ang);
    cx.strokeStyle=`rgba(255,40,40,${a})`;cx.lineWidth=s.lock?U*.8:U*.4;cx.setLineDash(s.lock?[]:[U*2,U*2]);
    cx.beginPath();cx.moveTo(h*.5,0);cx.lineTo(Math.hypot(W,H)*1.2,0);cx.stroke();cx.restore();
  }
  // ビーム
  if(s.ph==='fire'){
    const k=s.pt<.06?s.pt/.06:s.pt>s.fire-.12?Math.max(0,(s.fire-s.pt)/.12):1, bw=s.wide*k*(1+.08*Math.sin(s.pt*80));
    cx.save();cx.translate(x,y);cx.rotate(s.ang);cx.globalCompositeOperation='lighter';
    const L=Math.hypot(W,H)*1.3;
    for(const [ww,c] of [[bw*2.4,'rgba(255,30,30,.25)'],[bw*1.4,'rgba(255,60,40,.6)'],[bw*.8,'rgba(255,220,180,.95)'],[bw*.35,'#fff']]){cx.fillStyle=c;cx.fillRect(h*.3,-ww/2,L,ww)}
    cx.restore();
  }
  // 牌(中)
  cx.save();cx.translate(x,y);cx.rotate(s.ang-Math.PI/2);   // 牌の下側(発射口)がイータ君を向く
  let glow=s.ph==='charge'?s.pt/s.charge:s.ph==='fire'?1:0;
  if(glow>0){cx.shadowColor='rgba(255,40,40,.9)';cx.shadowBlur=U*6*glow}
  rr(-w/2,-h/2+U*1.2,w,h,U*1.6,'#1d7a3e');            // 牌の背(緑)
  cx.shadowBlur=0;
  if(chun.complete&&chun.naturalWidth)cx.drawImage(chun,-w/2,-h/2,w,h); else rr(-w/2,-h/2,w,h,U*1.6,'#faf5dc');   // 面
  if(glow>.7&&s.ph==='charge'&&Math.sin(s.pt*40)>0){rr(-w/2,-h/2,w,h,U*1.6,'rgba(255,60,60,.28)')}   // 発射直前の点滅
  cx.restore();
}
function rr(x,y,w,h,r,fill){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);cx.fillStyle=fill;cx.fill()}
const ease=u=>{u=clamp(u,0,1);return u*u*(3-2*u)};
function faceDraw(){
  if(faceGone&&!(state==='dead'&&deadT<=.05))return;   // 撃たれた後(結果・ランキング画面も)は顔を出さない
  const w=FW(),h=FH();
  cx.save();cx.translate(P.x,P.y);
  const wob=state==='play'?Math.sin(t*6)*.04:0;cx.rotate(wob);
  cx.shadowColor='rgba(0,0,0,.5)';cx.shadowBlur=U*3;cx.shadowOffsetY=U*1.5;
  if(face.complete)cx.drawImage(face,-w/2,-h/2,w,h);
  cx.restore();
}
function draw(){
  cx.save();
  if(shake>.3)cx.translate(rand(-1,1)*shake,rand(-1,1)*shake);
  bg();
  for(const s of tiles)if(s.ph==='charge'||s.ph==='fire')tileDraw(s); // ビームを先に
  faceDraw();
  for(const s of tiles)if(s.ph!=='charge'&&s.ph!=='fire')tileDraw(s);
  for(const p of parts){cx.globalAlpha=clamp(p.l*2,0,1);cx.fillStyle=p.c;cx.fillRect(p.x-U*.6,p.y-U*.6,U*1.2,U*1.2)}
  cx.globalAlpha=1;
  cx.font=`700 ${U*5}px serif`;cx.textAlign='center';
  for(const f of floats){cx.globalAlpha=clamp(f.l*2,0,1);cx.fillStyle='#ffd84a';cx.strokeStyle='#000';cx.lineWidth=U;cx.strokeText(f.s,f.x,f.y);cx.fillText(f.s,f.x,f.y)}
  cx.globalAlpha=1;
  if(state==='dead'){cx.fillStyle=`rgba(120,0,0,${Math.min(.45,deadT*.6)})`;cx.fillRect(-50,-50,W+100,H+100)}
  cx.restore();
  hud.innerHTML=state==='play'?`${t.toFixed(2)}<small>秒 ／ ベスト ${best.toFixed(2)}</small>`:'';
}

// ---- 画面 ----
// ランキング: Google Apps Script(スプレッドシート)に保存。部屋はURLの ?r=xxx(なければ main)
const API='https://script.google.com/macros/s/AKfycbynBcBj3S36_LHCpeo2NPMi2oa24NuiCL09STJsDQmcHFH0quIwmIFkRX5LpxJjJSXIHA/exec';
// LINEの中で開いた時(LIFF)は LINEの名前・アイコン・ID を使う。外のブラウザでは手入力の名前
const LIFF_ID='2012295121-PtYTLtJI';
let lineUser=null;   // {id,name,pic}
// LIFF経由で開くと ?liff.state=... に元のクエリが入ることがあるので両方見る
const QS=new URLSearchParams(location.search), QS2=new URLSearchParams((QS.get('liff.state')||'').replace(/^[^?]*\?/,''));
const ROOM=(QS.get('r')||QS2.get('r')||'main').slice(0,20);
let myName='';try{myName=localStorage.getItem('eta_chun_name')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveName(v){myName=v.trim().slice(0,12);try{localStorage.setItem('eta_chun_name',myName)}catch(e){}}
function api(q){const b={r:ROOM};if(lineUser){b.u=lineUser.id;if(lineUser.pic)b.p=lineUser.pic}return fetch(API+'?'+new URLSearchParams(Object.assign(b,q))).then(r=>r.json())}
let pending=null, lastOver=null;   // pending=送信中のスコア / lastOver=[秒,ベスト更新,ギリギリ,送信済み]
function send(){const o=lastOver;if(!o||o[3]||!myName||!(o[0]>0))return;o[3]=true;pending=api({a:'add',n:myName,s:o[0].toFixed(2),g:o[2]}).catch(()=>null)}
function showTitle(){
  state='title';reset();
  ui.className='';ui.innerHTML=`<h1>イータ君<br><b>中</b>ビームよけ</h1>
  <p>画面の端から出てくる「中」の牌が<br>ビームを撃ってくる。<br>指でなぞってイータ君を動かし、<br>よけ続けろ。</p>
  <p style="font-size:13px;opacity:.7">赤い線が太くなったら発射の合図</p>
  ${lineUser?`<p class="who">${lineUser.pic?`<img src="${esc(lineUser.pic)}">`:''}${esc(lineUser.name)} さん</p>`:`<input id="nm" class="nm" maxlength="12" placeholder="なまえ（ランキング用）" value="${esc(myName)}">`}
  ${best?`<p>ベスト 還付金 ${fmt(best)} 円</p>`:''}
  <button class="btn go" id="go">はじめる</button>
  <button class="btn rk" id="rk">ランキング</button>`;
  const nm=document.getElementById('nm'),take=()=>{if(nm)saveName(nm.value)};if(nm)nm.onchange=take;
  document.getElementById('go').onclick=()=>{take();start()};
  document.getElementById('rk').onclick=()=>{take();showRank('title')};
  const rb=document.getElementById('rk').getBoundingClientRect();homeY=rb.bottom+U*3+FH()/2;P.y=clamp(homeY,FH()/2,H-FH()/2);
}
function start(){initAudio();if(AC&&AC.state==='suspended')AC.resume();reset();state='play';ui.className='hide';play('start',.9)}
function showOver(sc,nb){
  if(sc!==undefined){lastOver=[sc,nb,near,false];send()}   // 名前があれば終わった時点で送っておく
  const [s,b,g]=lastOver;
  state='over';ui.className='';
  const m=yen(s,g), anim=sc!==undefined;
  ui.innerHTML=`<div class="over">ちんだ。</div>
  <div class="slip"><h2>還付金のお知らせ</h2>
   <div class="row"><span>還付金</span><span>${fmt(m.h)} 円</span></div><div class="sub">生存 ${s.toFixed(2)} 秒</div>
   <div class="row"><span>還付加算金</span><span>${fmt(m.k)} 円</span></div><div class="sub">ギリギリ回避 ${g} 回（+${g*10}%）</div>
   <div class="row tot"><span>合計</span><span><b id="tot">${anim?0:fmt(m.y)}</b> 円</span></div></div>
  <p style="font-size:15px;color:#ffd84a">還付金の振込予定日は<br>2026年11月21日……だったのに。</p>
  <p>${b?'<b style="color:#ffd84a">ベスト更新！</b>　':''}ベスト ${fmt(best)} 円</p>
  ${myName?'':`<input id="nm" class="nm" maxlength="12" placeholder="なまえを入れるとランキングに載る">`}
  <button class="btn go" id="go">もう一回</button>
  <button class="btn rk" id="rk">ランキング</button>`;
  const takeName=()=>{const n=document.getElementById('nm');if(n&&n.value.trim()){saveName(n.value);send()}};
  document.getElementById('go').onclick=()=>{takeName();start()};
  document.getElementById('rk').onclick=()=>{takeName();showRank('over')};
  if(anim){   // 合計を0から数え上げる
    const el=document.getElementById('tot'),t0=performance.now()+350,D=900;
    (function up(now){if(state!=='over'||!el.isConnected)return;const q=Math.max(0,Math.min(1,(now-t0)/D));el.textContent=fmt(Math.floor(m.y*(1-Math.pow(1-q,3))));
      if(q<1)requestAnimationFrame(up)})(performance.now());
  }
}
async function showRank(from){
  state='rank';ui.className='';
  ui.innerHTML=`<h1 style="font-size:32px">ランキング</h1><div class="rkbox"><p>読み込み中…</p></div>`;
  let d=null;
  try{ if(pending){await pending;pending=null} d=await api({a:'list'}) }catch(e){}
  const rows=d&&d.list?d.list:null, k=rows?rows.findIndex(r=>lineUser?r.me:r.n===myName):-1;
  const body=!rows?'<p>ランキングを読み込めませんでした。<br>電波のいい所でもう一回押してね。</p>'
    :!rows.length?'<p>まだ誰も載っていない。<br>一番乗りのチャンス！</p>'
    :'<table>'+rows.slice(0,10).map((r,i)=>`<tr class="${i===k?'me':''}"><td class="no">${['🥇','🥈','🥉'][i]||(i+1)}</td><td class="na">${r.i?`<img src="${esc(r.i)}">`:''}${esc(r.n)}</td><td class="sc">${fmt(Number(r.y)||0)}<small>円</small></td></tr>`).join('')+'</table>'
      +(k>=10?`<p>あなたは ${k+1} 位（${fmt(Number(rows[k].y)||0)}円）</p>`:'');
  ui.innerHTML=`<h1 style="font-size:32px">ランキング</h1>
  <div class="rkbox">${body}</div>
  ${myName?'':'<p style="font-size:13px;opacity:.8">なまえを入れて遊ぶとランキングに載ります</p>'}
  <button class="btn go" id="go">${from==='over'?'もう一回':'はじめる'}</button>
  <button class="btn rk" id="bk">もどる</button>`;
  document.getElementById('go').onclick=start;
  document.getElementById('bk').onclick=()=>from==='over'&&lastOver?showOver():showTitle();
}

face.onload=()=>{};
showTitle();
// LIFFの準備(LINEの中だけ)。失敗しても手入力の名前でそのまま遊べる
if(window.liff){
  liff.init({liffId:LIFF_ID}).then(()=>{
    if(!liff.isLoggedIn())return;
    return liff.getProfile().then(p=>{
      lineUser={id:p.userId,name:String(p.displayName||'').slice(0,20),pic:p.pictureUrl||''};
      myName=lineUser.name;
      if(state==='title')showTitle();
    });
  }).catch(()=>{});
}
last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
